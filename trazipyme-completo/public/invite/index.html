<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TraziPyme — Aceptar invitación</title>
<script src="../shared/config.js"></script>
<style>
  body{margin:0;font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;background:#F4F6F5;color:#1B1B1B;}
  .wrap{max-width:380px;margin:80px auto;padding:0 20px;text-align:center;}
  .card{background:#fff;border-radius:16px;padding:24px;box-shadow:0 1px 3px rgba(0,0,0,.06);text-align:left;}
  input{width:100%;padding:12px;border-radius:10px;border:1px solid #DADDE0;font-size:15px;margin-bottom:10px;box-sizing:border-box;}
  label{font-size:12px;color:#6B7280;font-weight:600;display:block;margin-bottom:4px;}
  .btn{width:100%;padding:14px;border:none;border-radius:12px;font-size:15px;font-weight:700;background:#2E7D32;color:#fff;cursor:pointer;}
  .muted{color:#6B7280;font-size:13px;}
  .error{color:#C0392B;font-size:13px;margin:6px 0;}
  .ok{color:#2E7D32;font-size:14px;margin:6px 0;font-weight:600;}
</style>
</head>
<body>
<div class="wrap">
  <div style="font-size:36px;">📦</div>
  <h2 style="color:#2E7D32;">Activa tu cuenta TraziPyme</h2>
  <div class="card">
    <p class="muted" id="intro">Crea tu contraseña para comenzar a usar la app y/o el dashboard.</p>
    <div id="form">
      <label>Nueva contraseña (mínimo 8 caracteres)</label>
      <input id="password" type="password" placeholder="••••••••">
      <label>Repite la contraseña</label>
      <input id="password2" type="password" placeholder="••••••••">
      <div class="error" id="error"></div>
      <button class="btn" onclick="aceptar()">Activar cuenta</button>
    </div>
    <div id="resultado" style="display:none;"></div>
  </div>
</div>
<script>
function getToken(){ return new URLSearchParams(location.search).get('token'); }
async function aceptar(){
  const token = getToken();
  const p1 = document.getElementById('password').value;
  const p2 = document.getElementById('password2').value;
  const errEl = document.getElementById('error');
  errEl.textContent = '';
  if(!token){ errEl.textContent = 'Falta el token de invitación en el enlace.'; return; }
  if(p1.length < 8){ errEl.textContent = 'La contraseña debe tener al menos 8 caracteres.'; return; }
  if(p1 !== p2){ errEl.textContent = 'Las contraseñas no coinciden.'; return; }
  try{
    const res = await fetch(`${window.TRAZI_CONFIG.FUNCTIONS_URL}/accept-invitation`, {
      method:'POST', headers:{'Content-Type':'application/json', apikey: window.TRAZI_CONFIG.SUPABASE_ANON_KEY},
      body: JSON.stringify({ token, password: p1 }),
    });
    const data = await res.json();
    if(!res.ok) throw new Error(data.error || 'Error al activar la cuenta');
    document.getElementById('form').style.display='none';
    const r = document.getElementById('resultado');
    r.style.display='block';
    r.innerHTML = `<div class="ok">✓ Cuenta activada para ${data.email}</div><p class="muted">Ya puedes iniciar sesión en la <a href="../app/">app móvil</a> o el <a href="../dashboard/">dashboard</a>.</p>`;
  }catch(e){ errEl.textContent = e.message; }
}
if(!getToken()){ document.getElementById('intro').textContent = 'Este enlace no incluye un token válido. Pide a tu administrador que te reenvíe la invitación.'; document.getElementById('form').style.display='none'; }
</script>
</body>
</html>
