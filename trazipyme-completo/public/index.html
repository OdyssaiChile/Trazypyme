<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TraziPyme</title>
<style>
  body{margin:0;font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;background:#F4F6F5;color:#1B1B1B;display:flex;align-items:center;justify-content:center;min-height:100vh;}
  .wrap{text-align:center;max-width:420px;padding:20px;}
  .logo{font-size:48px;}
  h1{color:#2E7D32;margin:8px 0 4px;}
  .muted{color:#6B7280;font-size:14px;margin-bottom:26px;}
  .links{display:flex;flex-direction:column;gap:12px;}
  a.btn{display:block;padding:16px;border-radius:14px;text-decoration:none;font-weight:700;font-size:15px;}
  a.app{background:#2E7D32;color:#fff;}
  a.dash{background:#fff;color:#2E7D32;border:2px solid #2E7D32;}
  a.admin{background:#1B1B1B;color:#fff;}
</style>
</head>
<body>
  <div class="wrap">
    <div class="logo">📦</div>
    <h1>TraziPyme</h1>
    <div class="muted">Inventario simple para tu bodega — por Odyssai</div>
    <div class="links">
      <a class="btn app" href="./app/">Abrir app de bodega (operarios)</a>
      <a class="btn dash" href="./dashboard/">Abrir dashboard (dueños / gerentes)</a>
      <a class="btn admin" href="./admin/">Panel Odyssai (staff interno)</a>
    </div>
  </div>
</body>
</html>
